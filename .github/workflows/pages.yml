name: Deploy EcuApp website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate static HTML, CSS and JavaScript
        run: node scripts/validate-site.mjs
      - name: Test responsive layouts and interactions
        run: node scripts/test-responsive.mjs
      - name: Capture live public-site screenshots and layout metrics
        if: always()
        run: node scripts/audit-public-site.mjs
      - name: Upload public-site audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-audit-${{ github.run_number }}
          path: artifacts/public-site-audit/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
