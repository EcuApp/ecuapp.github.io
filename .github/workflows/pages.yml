name: Deploy EcuApp website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecuapp-site-build
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.52.0
      - name: Prepare browser for live audit and responsive tests
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PUBLIC_AUDIT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "PUBLIC_AUDIT_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "PUBLIC_AUDIT_BROWSER_EXECUTABLE=$(command -v chromium-browser)" >> "$GITHUB_ENV"
            chromium-browser --version
          else
            npx playwright install chromium
          fi
      - name: Validate static HTML, CSS and JavaScript
        run: node scripts/validate-site.mjs
      - name: Test responsive layouts and interactions
        run: node scripts/test-responsive.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
